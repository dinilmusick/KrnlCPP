name: C++ lifecycle portability
on:
  push:
    branches: [main, feat/cpp-service-lifecycle-contract]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_CXX_STANDARD=17
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run lifecycle regression suite
        run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan and UBSan
        run: cmake -S . -B build-sanitized -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Run sanitized tests
        run: ctest --test-dir build-sanitized --output-on-failure
