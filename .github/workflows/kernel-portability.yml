name: kernel-portability
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Installed consumer
        shell: bash
        run: |
          cmake --install build --config ${{ matrix.config }} --prefix "$RUNNER_TEMP/krnl-install"
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/krnl-install"
          cmake --build consumer/build --config ${{ matrix.config }}
          ctest --test-dir consumer/build -C ${{ matrix.config }} --output-on-failure
  strict:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        flags: ['-Wall -Wextra -Wpedantic -Werror', '-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer']
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_FLAGS='${{ matrix.flags }}' -DCMAKE_EXE_LINKER_FLAGS='${{ matrix.flags }}'
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
